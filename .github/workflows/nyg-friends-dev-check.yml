
name: NYG Friends DEV Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NYG Friends DEV
        uses: actions/checkout@v4
        with:
          ref: nyg-friends-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check DEV Worker
        run: |
          npx --yes wrangler@4 deploy nyg-friends-api.js \
            --name nyg-friends-dev-api \
            --compatibility-date 2026-10-15 \
            --dry-run \
            --outdir /tmp/nyg-friends-dev-check
