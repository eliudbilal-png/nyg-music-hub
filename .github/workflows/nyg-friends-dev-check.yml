
name: NYG Friends DEV Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NYG Friends DEV
        uses: actions/checkout@v4
        with:
          ref: nyg-friends-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check DEV Worker
        run: |
          
          npx --yes wrangler@4 deploy \
            --config wrangler.friends-api.jsonc \
            --dry-run \
            --outdir /tmp/nyg-friends-dev-check

