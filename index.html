<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NYG MUSIC HUB</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#faf7f9;
  color:#222;
}

header{
  background:#a9005b;
  color:white;
  text-align:center;
  padding:38px 20px;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  font-size:18px;
  margin:12px 0 0;
}

main{
  max-width:760px;
  margin:30px auto;
  padding:0 18px;
}

.card{
  background:white;
  border-radius:20px;
  padding:24px;
  box-shadow:0 5px 25px #0001;
}

h2{
  margin-top:0;
}

.song{
  display:flex;
  gap:18px;
  align-items:center;
  margin:25px 0;
}

.cover{
  width:100px;
  height:100px;
  min-width:100px;
  border-radius:16px;
  background:#a9005b;
  color:white;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:bold;
}

.song h3{
  margin:0 0 10px;
  font-size:20px;
}

.song p{
  margin:0;
  color:#666;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:16px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

.buy{
  background:#b00060;
  color:white;
}

.buy:hover{
  background:#92004f;
}

.download{
  background:#eeeeee;
  color:#777;
  cursor:not-allowed;
}

.info{
  background:#fff4fa;
  border-left:4px solid #a9005b;
  padding:14px;
  margin-top:20px;
  border-radius:8px;
  font-size:14px;
  line-height:1.5;
}

.note{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:14px;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>NYG MUSIC HUB</h1>
  <p>Official Music Store</p>
</header>

<main>

<div class="card">

<h2>Karibu NYG MUSIC HUB</h2>

<div class="song">

  <div class="cover">
    NYG
  </div>

  <div>
    <h3>I'm Still Going On / Bado Naendelea</h3>
    <p>NYG Music</p>
  </div>

</div>

<button class="buy" onclick="startPayment()">
  💳 Nunua / Support — TSh 1,000
</button>

<button class="download" disabled>
  🔒 Download baada ya malipo
</button>

<div class="info">
  💡 Baada ya kukamilisha malipo kupitia MalipoPay,
  download ya wimbo itawezeshwa baada ya malipo kuthibitishwa.
</div>

<p class="note">
  Malipo salama kupitia MalipoPay.
</p>

</div>

</main>

<footer>
  © 2026 NYG MUSIC HUB<br>
  All Rights Reserved.
</footer>

<script>

function startPayment(){

  window.location.href =
  "https://app.malipopay.co.tz/pay/nygmusichub";

}

</script>

</body>
</html>
