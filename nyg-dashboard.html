<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NYG Friends | Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: #f1f5fb;
      color: #182235;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 28px 22px;
      background: #fff;
      border: 1px solid #dce3ed;
      border-radius: 18px;
      box-shadow: 0 8px 28px #14213d12;
    }

    .brand { color: #1769d2; font-weight: 700; }
    h1 { margin-bottom: 8px; }
    p { color: #586579; line-height: 1.6; }
    .detail { padding: 14px 0; border-bottom: 1px solid #e5eaf1; }
    .label { display: block; margin-bottom: 5px; color: #687386; }
    #status { text-align: center; }
    .quiz-results {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #e5eaf1;
    }

    .quiz-card {
      margin: 14px 0;
      padding: 14px;
      border: 1px solid #dce3ed;
      border-radius: 12px;
    }

    .quiz-card h3 { margin: 0 0 8px; }
    .quiz-card p { margin: 8px 0; }

    .ranking {
      margin: 12px 0 0;
      padding-left: 28px;
    }

    .ranking li {
      
      padding: 8px 0;
      border-bottom: 1px solid #edf0f5;
      line-height: 1.5;
    }
.ranking li:nth-child(-n+3) {
  background: #fff7df;
  border: 1px solid #f1c75b;
  border-radius: 10px;
  margin: 8px 0;
  padding: 12px;
  font-weight: 700;
}

.ranking li:nth-child(-n+3)::after {
  content: ' 🎁 ZAWADI';
  color: #a66b00;
}
    .muted { color: #687386; }
    a {
      display: block;
      margin-top: 24px;
      padding: 14px;
      border-radius: 10px;
      background: #1769d2;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 700;

    }
  </style>
</head>

<body>
  <main>
    <div class="brand">NYG FRIENDS</div>
    <h1>Dashboard ya mwanachama</h1>
    <p id="status">Inakagua akaunti yako…</p>

    <section id="details" hidden>
      <div class="detail">
        <span class="label">Jina kamili</span>
        <strong id="memberName"></strong>
      </div>
      <div class="detail">
        <span class="label">Barua pepe</span>
        <strong id="memberEmail"></strong>
      </div>
      <div class="detail">
        <span class="label">Namba ya mwanachama</span>
        <strong id="memberCode"></strong>
      </div>
            <section id="quizResults" class="quiz-results">
        <h2>Matokeo ya Quiz</h2>
        <p id="quizResultsStatus" class="muted">Inapakia matokeo…</p>
        <div id="quizResultsList"></div>
      </section>
      <a href="/nyg-market-place.html">Endelea kwenye NYG Friends</a>
    </section>
  </main>

  <script>
async function loadQuizResults() {
  const status = document.getElementById('quizResultsStatus');
  const list = document.getElementById('quizResultsList');

  try {
    const response = await fetch('/api/quiz/results', {
      method: 'GET',
      credentials: 'same-origin',
      cache: 'no-store'
    });
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Imeshindikana kupata matokeo.');
    }

    const competitions = Array.isArray(data.competitions)
      ? data.competitions
      : [];

    if (competitions.length === 0) {
      status.textContent = 'Bado hakuna matokeo rasmi. Alama: 0.';
      return;
    }

    status.textContent = '';
    list.replaceChildren();

    for (const competition of competitions) {
      const card = document.createElement('article');
      card.className = 'quiz-card';

      const title = document.createElement('h3');
      title.textContent = competition.title || 'Quiz';
      card.appendChild(title);

      const own = competition.my_result;
      const score = document.createElement('p');
      score.textContent = own
        ? `Nafasi yako: ${own.rank} | Pointi: ${own.points}`
        : 'Hujashiriki kwenye mashindano haya.';
      card.appendChild(score);

      const ranking = document.createElement('ol');
      ranking.className = 'ranking';

      for (const player of competition.leaderboard || []) {
        const item = document.createElement('li');
        item.textContent =
          `${player.full_name || 'Mwanachama'} — ${player.points || 0} pointi`;
        ranking.appendChild(item);
      }

      card.appendChild(ranking);
      list.appendChild(card);
    }
  } catch (error) {
    status.textContent =
      error.message || 'Imeshindikana kupakia matokeo. Jaribu tena.';
  }
}    
    async function loadMember() {
      const status = document.getElementById('status');

      try {
        const response = await fetch('/api/members/me', {
          method: 'GET',
          credentials: 'same-origin'
        });

        if (!response.ok) {
          window.location.href = '/nyg-signin.html';
          return;
        }

        const result = await response.json();

        document.getElementById('memberName').textContent =
          result.member?.full_name || '';

        document.getElementById('memberEmail').textContent =
          result.member?.email || '';

        document.getElementById('memberCode').textContent =
          result.member?.member_code || '';

        status.hidden = true;
        document.getElementById('details').hidden = false;
        loadQuizResults();
      } catch {
        status.textContent =
          'Imeshindikana kuwasiliana na mfumo. Jaribu tena.';
      }
    }

    loadMember();
  </script>
</body>
</html>
